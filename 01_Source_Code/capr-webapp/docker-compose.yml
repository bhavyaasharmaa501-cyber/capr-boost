x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_Strong1}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: >
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" ||
        /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    logging: *logging

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_Strong1}
    volumes:
      - ./database/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /schema.sql ||
        /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -b -i /schema.sql
    restart: "no"
    logging: *logging

  ml-service:
    build: ./ml-service
    environment:
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-}
      UVICORN_WORKERS: "1"
    ports:
      - "127.0.0.1:${MLSERVICE_PORT:-8000}:8000"
    volumes:
      - ./ml-service/artifacts:/app/artifacts:ro
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend/src/CaprApi
    depends_on:
      mssql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_healthy
    environment:
      ConnectionStrings__CaprDb: "Server=mssql,1433;Database=CaprDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ChangeMe_Strong1};TrustServerCertificate=True;"
      MlService__BaseUrl: "http://ml-service:8000"
      MlService__ApiKey: ${ML_SERVICE_API_KEY:-}
      AdminSeed__Email: ${ADMIN_EMAIL:-admin@capr.local}
      AdminSeed__Password: ${ADMIN_PASSWORD:-Admin@12345}
      Auth__ShowResetCodeWithoutSmtp: ${SHOW_RESET_CODE_WITHOUT_SMTP:-true}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      Cors__AllowedOrigins__0: ${FRONTEND_ORIGIN:-http://localhost:4200}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-uploads:/app/App_Data/uploads
      - backend-keys:/app/App_Data/keys
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  frontend:
    build: ./frontend/capr-dashboard
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    restart: unless-stopped
    logging: *logging

volumes:
  mssql-data:
  backend-uploads:
  backend-keys:
